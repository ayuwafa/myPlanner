const takwimWeeks=[['2026-11-29',1],['2026-12-06',2],['2026-12-13',3],['2026-12-20',4],['2026-12-27',5],['2027-01-03',6],['2027-01-10',7],['2027-01-17',8],['2027-01-24',9],['2027-01-31',10],['2027-02-14',11],['2027-02-21',12],['2027-02-28',13],['2027-03-14',14],['2027-03-21',15]];

function save(){localStorage.setItem(KEY,JSON.stringify(data))}function esc(s){return String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}function cat(t){return {academic:'Akademik',holiday:'Cuti',personal:'Personal',work:'Kerja',pay:'Hari Gaji',school:'Cuti Sekolah',child:'Anak',schoolwork:'Urusan Sekolah',birthday:'Birthday'}[t]||'Lain-lain'}function weekNumber(date){for(const [st,n] of takwimWeeks){let a=parse(st),b=new Date(a);b.setDate(b.getDate()+(n===15?5:6));if(date>=new Date(a.getFullYear(),a.getMonth(),a.getDate())&&date<=new Date(b.getFullYear(),b.getMonth(),b.getDate(),23,59))return n}if(date>=parse('2026-11-22')&&date<=parse('2027-04-18'))return null;if(!data.semesterStart)return null;let start=parse(data.semesterStart),end=data.semesterEnd?parse(data.semesterEnd):null;let delta=Math.floor((date-start)/dayMs);if(delta<0||(end&&date>end))return null;let n=Math.floor(delta/7)+1;return n<=Number(data.semesterWeeks||14)?n:null}function eventsOn(d){return [...data.events,...builtInEvents].filter(e=>e.date===fmt(d)).sort((a,b)=>(a.time||'').localeCompare(b.time||''))}function eventItem(e){return `<div class="side-event" style="border-color:${{academic:'#9b70c9',holiday:'#ed94bd',personal:'#62b38b',work:'#72a5db',pay:'#e8b654',school:'#5db5b1',child:'#f2995e',schoolwork:'#8d6e5a',birthday:'#e2607f'}[e.type]||'#9b70c9'}"><b>${esc(e.title)}</b><small>${esc(e.time||'Sepanjang hari')} · ${cat(e.type)}</small>${e.note?`<div style="font-size:12px;margin-top:5px">${esc(e.note)}</div>`:''}<div style="margin-top:7px">${e.official?'<small>📌 Tarikh rujukan rasmi / kalendar</small>':`<button class="btn small" data-edit="${esc(e.id)}">Edit</button>`}</div></div>`}function render(){document.querySelectorAll('.nav').forEach(b=>b.classList.toggle('active',b.dataset.page===page));$('#pageTitle').textContent=page==='calendar'?'Good day, Ayu! 🌷':{agenda:'Semua Aktiviti 🌷',tasks:'My To-do List ✨',settings:'Tetapan Akademik ⚙️'}[page];$('#todayBtn').style.display=page==='calendar'?'':'none';if(page==='calendar')renderCalendar();if(page==='agenda')renderAgenda();if(page==='tasks')renderTasks();if(page==='settings')renderSettings();document.querySelectorAll('[data-edit]').forEach(b=>b.onclick=()=>openEvent(data.events.find(e=>e.id===b.dataset.edit)));}function renderCalendar(){let today=new Date(),m=selected.getMonth(),y=selected.getFullYear(),evMonth=[...data.events,...builtInEvents].filter(e=>e.date.startsWith(`${y}-${String(m+1).padStart(2,'0')}`));let nWeek=weekNumber(selected);let html=`<div class="stats" style="display:none"><div class="stat"><div class="cap">Aktiviti Bulan Ini</div><div class="num">${evMonth.length}</div><div class="cap">Termasuk cuti rasmi</div></div><div class="stat"><div class="cap">Minggu Akademik</div><div class="num">${nWeek?'W'+nWeek:'—'}</div><div class="cap">Pada tarikh dipilih</div></div><div class="stat"><div class="cap">Cuti Umum</div><div class="num">${evMonth.filter(e=>e.type==='holiday').length}</div><div class="cap">Bulan ini</div></div><div class="stat"><div class="cap">To-do Belum Siap</div><div class="num">${data.tasks.filter(t=>!t.done).length}</div><div class="cap">Perkara menunggu</div></div></div><div class="layout compact-layout"><section class="panel"><div class="calendar-head"><div><h3>${months[m]} ${y}</h3><span class="muted" style="font-size:12px">Pilih tarikh untuk lihat atau tambah aktiviti</span></div><div class="toolbar"><button class="btn small" id="prev">‹</button><button class="btn small" id="next">›</button><div class="views">${['month','week','day'].map(v=>`<button data-view="${v}" class="${v===view?'active':''}">${{month:'Month',week:'Week',day:'Day'}[v]}</button>`).join('')}</div></div></div>`;if(view==='month'){html+='<div class="days">'+['Aha','Isn','Sel','Rab','Kha','Jum','Sab'].map(d=>`<div class="weekday">${d}</div>`).join('');let first=new Date(y,m,1),offset=first.getDay(),cellCount=Math.ceil((offset+new Date(y,m+1,0).getDate())/7)*7;for(let i=0;i<cellCount;i++){let d=new Date(y,m,1-offset+i),ev=eventsOn(d);html+=`<button class="day ${d.getMonth()!==m?'dim':''} ${fmt(d)===fmt(today)?'today':''} ${fmt(d)===fmt(selected)?'selected':''}" data-date="${fmt(d)}"><div class="date">${d.getDate()} ${weekNumber(d)&&d.getDay()===0?`<small style="color:#9563c1">W${weekNumber(d)}</small>`:''}</div><div class="cell-notes">${ev.filter(e=>e.type!=='school').slice(0,2).map(e=>`<div class="cell-note ${esc(e.type)}">${esc(e.title)}</div>`).join('')}${ev.some(e=>e.type==='school')?`<div class="cell-note school">🏫 ${esc(ev.find(e=>e.type==='school').title)}</div>`:''}${ev.length>3?`<small class="more">+${ev.length-3} lagi</small>`:''}</div></button>`}html+='</div>'}else{let days=[];if(view==='day')days=[new Date(selected)];else{let start=new Date(selected);start.setDate(start.getDate()-start.getDay());for(let i=0;i<7;i++){let d=new Date(start);d.setDate(d.getDate()+i);days.push(d)}}html+=days.map(d=>`<div class="agenda-row"><div class="agenda-date"><button class="btn small" data-date="${fmt(d)}">${d.toLocaleDateString('ms-MY',{weekday:'short',day:'numeric',month:'short'})}</button>${weekNumber(d)?`<div>W${weekNumber(d)}</div>`:''}</div><div class="agenda-body">${eventsOn(d).length?eventsOn(d).map(eventItem).join(''):'<span class="muted">Tiada aktiviti</span>'}</div></div>`).join('')}html+=`<div class="legend">${['academic','holiday','school','work','personal','pay','child','schoolwork','birthday'].map(t=>`<label><span class="dot" style="background:${{academic:'#a477d0',holiday:'#ed94bd',personal:'#62b38b',work:'#72a5db',pay:'#e8b654',school:'#5db5b1',child:'#f2995e',schoolwork:'#8d6e5a',birthday:'#e2607f'}[t]}"></span>${cat(t)}</label>`).join('')}</div></section><section><div class="panel"><h3>🌷 ${parse(fmt(selected)).toLocaleDateString('ms-MY',{day:'numeric',month:'long',year:'numeric'})}</h3>${nWeek?`<div class="notice">📚 Minggu Akademik ${nWeek}</div>`:''}${eventsOn(selected).length?eventsOn(selected).map(eventItem).join(''):'<div class="empty">Belum ada aktiviti untuk tarikh ini.</div>'}<button class="btn primary" id="addSelected" style="width:100%;margin-top:8px">＋ Tambah pada tarikh ini</button></div><div class="panel" style="display:none;margin-top:16px"><h3>💜 Nota Minggu Akademik</h3><div class="muted" style="font-size:12px">Set tarikh mula semester di Tetapan Akademik. W1, W2 dan seterusnya akan dikira secara automatik setiap 7 hari.</div><button class="btn small" id="goSettings" style="margin-top:12px">Tetapkan semester</button></div></section></div>`;$('#app').innerHTML=html;$('#prev').onclick=()=>{if(view==='month')selected=new Date(y,m-1,Math.min(selected.getDate(),28));else selected.setDate(selected.getDate()-(view==='week'?7:1));render()};$('#next').onclick=()=>{if(view==='month')selected=new Date(y,m+1,Math.min(selected.getDate(),28));else selected.setDate(selected.getDate()+(view==='week'?7:1));render()};document.querySelectorAll('[data-view]').forEach(b=>b.onclick=()=>{view=b.dataset.view;render()});document.querySelectorAll('[data-date]').forEach(b=>b.onclick=()=>{selected=parse(b.dataset.date);view='day';render()});$('#addSelected').onclick=()=>openEvent();$('#goSettings').onclick=()=>{page='settings';render()};document.querySelectorAll('[data-edit]').forEach(b=>b.onclick=()=>openEvent(data.events.find(e=>e.id===b.dataset.edit)))}function renderAgenda(){let list=[...data.events,...builtInEvents].sort((a,b)=>a.date.localeCompare(b.date)||(a.time||'').localeCompare(b.time||''));$('#app').innerHTML=`<div class="hero"><div><h3>All your lovely plans 🌷</h3><p>Semua aktiviti yang telah direkodkan.</p></div><div class="flower">📖</div></div><div class="panel"><div class="toolbar" style="margin-bottom:15px"><input id="search" placeholder="Cari aktiviti..." style="padding:11px;border:1px solid #e2d6e9;border-radius:10px;flex:1;min-width:150px"><select id="filter" class="btn"><option value="all">Semua kategori</option>${['academic','holiday','work','personal','pay','child','schoolwork','birthday'].map(t=>`<option value="${t}">${cat(t)}</option>`).join('')}</select></div><div id="agendaList"></div></div>`;function update(){let q=$('#search').value.toLowerCase(),f=$('#filter').value;let filtered=list.filter(e=>(f==='all'||e.type===f)&&(e.title+' '+e.note).toLowerCase().includes(q));$('#agendaList').innerHTML=filtered.length?filtered.map(e=>`<div class="agenda-row"><div class="agenda-date">${parse(e.date).toLocaleDateString('ms-MY',{day:'numeric',month:'short',year:'numeric'})}</div><div class="agenda-body">${eventItem(e)}</div></div>`).join(''):'<div class="empty">Tiada aktiviti dijumpai.</div>';document.querySelectorAll('[data-edit]').forEach(b=>b.onclick=()=>openEvent(data.events.find(e=>e.id===b.dataset.edit)))}$('#search').oninput=update;$('#filter').onchange=update;update()}function renderTasks(){$('#app').innerHTML=`<div class="hero"><div><h3>Little steps, lovely progress ✨</h3><p>Susun tugasan harian tanpa rasa berserabut.</p></div><div class="flower">🦋</div></div><div class="panel"><div class="toolbar"><input id="newTask" placeholder="Tambah tugasan baru..." maxlength="150" style="padding:11px;border:1px solid #e2d6e9;border-radius:10px;flex:1;min-width:160px"><button class="btn primary" id="addTask">Tambah</button></div><div class="tasks">${data.tasks.length?data.tasks.map(t=>`<label><input type="checkbox" data-task="${esc(t.id)}" ${t.done?'checked':''}><span class="${t.done?'done':''}" style="flex:1">${esc(t.text)}</span><button class="btn small danger" data-remove-task="${esc(t.id)}">Padam</button></label>`).join(''):'<div class="empty">Belum ada tugasan. Tambah satu untuk bermula 💜</div>'}</div></div>`;function add(){let text=$('#newTask').value.trim();if(!text)return;data.tasks.push({id:crypto.randomUUID(),text,done:false});save();render()}$('#addTask').onclick=add;$('#newTask').onkeydown=e=>{if(e.key==='Enter')add()};document.querySelectorAll('[data-task]').forEach(b=>b.onchange=()=>{let t=data.tasks.find(t=>t.id===b.dataset.task);if(t)t.done=b.checked;save();render()});document.querySelectorAll('[data-remove-task]').forEach(b=>b.onclick=()=>{data.tasks=data.tasks.filter(t=>t.id!==b.dataset.removeTask);save();render()})}function renderSettings(){$('#app').innerHTML=`<div class="hero"><div><h3>Shape your semester 💜</h3><p>Sesuaikan planner dengan takwim sebenar politeknik.</p></div><div class="flower">🎓</div></div><div class="panel"><h3>📚 Tetapan Minggu Akademik</h3><div class="notice">Prototype ini mengira minggu akademik secara berurutan setiap 7 hari bermula dari tarikh mula. Cuti pertengahan semester belum ditolak secara automatik. Untuk takwim rasmi yang mempunyai minggu rehat, label perlu disemak.</div><div class="settings-grid"><div class="field"><label>Tarikh mula semester</label><input id="semesterStart" type="date" value="${esc(data.semesterStart)}"></div><div class="field"><label>Tarikh tamat semester (optional)</label><input id="semesterEnd" type="date" value="${esc(data.semesterEnd)}"></div><div class="field"><label>Bilangan minggu akademik</label><input id="semesterWeeks" type="number" min="1" max="30" value="${Number(data.semesterWeeks)}"></div></div><button class="btn primary" id="saveSettings">Simpan Tetapan</button></div><div class="panel" style="margin-top:16px"><h3>💾 Backup & Import</h3><p class="muted">Simpan fail JSON sebagai backup. Import akan menggantikan semua data planner pada browser ini.</p><div class="toolbar"><button class="btn" id="exportBtn">⬇ Export JSON</button><label class="btn" style="cursor:pointer">⬆ Import JSON<input id="importFile" type="file" accept="application/json,.json" hidden></label><button class="btn danger" id="resetBtn">Kosongkan Data</button></div></div><div class="panel" style="margin-top:16px"><h3>🇲🇾 Cuti Malaysia & Politeknik</h3><p class="muted">Cuti umum Malaysia dan Kelantan serta cuti sekolah KPM Kumpulan A untuk 2026 dan 2027 telah dimasukkan sebagai data rujukan. Takwim PdP PKB Sesi II 2026/2027 (tarikh penting & minggu W1–W15, cuti pertengahan/perayaan tidak dikira) telah dimasukkan dan mengatasi tetapan semester di atas bagi tempoh tersebut. Tarikh gaji 2026 dan 2027 telah dimasukkan berdasarkan jadual rujukan JANM; semak pindaan rasmi. Tarikh boleh berubah mengikut pengumuman rasmi. Data rasmi tidak dipadam oleh Reset.</p></div>`;$('#saveSettings').onclick=()=>{let a=$('#semesterStart').value,b=$('#semesterEnd').value,w=Number($('#semesterWeeks').value);if(a&&b&&b<a)return alert('Tarikh tamat mesti selepas tarikh mula.');if(!Number.isInteger(w)||w<1||w>30)return alert('Bilangan minggu mestilah antara 1 hingga 30.');Object.assign(data,{semesterStart:a,semesterEnd:b,semesterWeeks:w});save();alert('Tetapan berjaya disimpan.');render()};$('#exportBtn').onclick=()=>{let blob=new Blob([JSON.stringify(data,null,2)],{type:'application/json'}),url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download='my-academic-planner-backup.json';a.click();setTimeout(()=>URL.revokeObjectURL(url),1000)};$('#importFile').onchange=async e=>{let f=e.target.files[0];if(!f)return;try{let d=JSON.parse(await f.text());if(!Array.isArray(d.events)||!Array.isArray(d.tasks)||d.events.some(x=>typeof x.title!=='string'||typeof x.date!=='string'||typeof x.type!=='string')||d.tasks.some(x=>typeof x.text!=='string'))throw Error('Format data tidak sah');if(!confirm('Import akan menggantikan data sekarang. Teruskan?'))return;data={...structuredClone(defaultData),...d};save();render();alert('Import berjaya.')}catch(err){alert('Fail JSON tidak sah: '+err.message)}};$('#resetBtn').onclick=()=>{if(confirm('Padam SEMUA aktiviti, tugasan dan tetapan pada browser ini?')){data=structuredClone(defaultData);save();render()}}}function openEvent(e){$('#eventForm').reset();$('#eventId').value=e?.id||'';$('#dialogTitle').textContent=e?'Edit Aktiviti 🌷':'Tambah Aktiviti 🌸';$('#eventTitle').value=e?.title||'';$('#eventDate').value=e?.date||fmt(selected);$('#eventTime').value=e?.time||'';$('#eventType').value=e?.type||'academic';$('#eventNote').value=e?.note||'';$('#deleteEvent').style.display=e?'':'none';$('#eventDialog').showModal()}$('#eventForm').addEventListener('submit',e=>{e.preventDefault();let title=$('#eventTitle').value.trim(),date=$('#eventDate').value;if(!title||!date)return;let id=$('#eventId').value||crypto.randomUUID(),item={id,title,date,time:$('#eventTime').value,type:$('#eventType').value,note:$('#eventNote').value.trim()};data.events=data.events.filter(e=>e.id!==id);data.events.push(item);save();$('#eventDialog').close();render()});$('#cancelEvent').onclick=()=>$('#eventDialog').close();$('#deleteEvent').onclick=()=>{let id=$('#eventId').value;if(id&&confirm('Padam aktiviti ini?')){data.events=data.events.filter(e=>e.id!==id);save();$('#eventDialog').close();render()}};$('#addBtn').onclick=()=>openEvent();$('#todayBtn').onclick=()=>{selected=new Date();render()};document.querySelectorAll('.nav').forEach(b=>b.onclick=()=>{page=b.dataset.page;render()});render();
/* Data tambahan dari planner-data.json (dikemas kini terus di GitHub) */

(Array.isArray(j.events)?j.events:[]).forEach((e,i)=>{if(e&&typeof e.title==='string'&&typeof e.date==='string')builtInEvents.push({id:'json-'+i,date:e.date,time:e.time||'',title:e.title,type:e.type||'academic',note:e.note||'',official:true})});
